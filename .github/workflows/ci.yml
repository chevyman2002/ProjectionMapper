name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare workspace and checkout exact commit
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Cleaning workspace..."
          rm -rf "$GITHUB_WORKSPACE"/* || true
          echo "Cloning $REPO into workspace"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin https://x-access-token:${TOKEN}@github.com/${REPO}
          # Fetch only the specific commit, fallback to fetching refs if needed
          if git fetch --depth=1 origin ${SHA}; then
            git checkout FETCH_HEAD
          else
            git fetch --no-tags --depth=1 origin +refs/heads/*:refs/remotes/origin/*
            git fetch --depth=1 origin ${SHA} || true
            git checkout --force ${SHA}
          fi
          echo "Checked out commit: $(git rev-parse --short HEAD)"

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates wget unzip git

      - name: Install .NET 9 SDK (local installer)
        run: |
          set -eux
          DOTNET_INSTALL_DIR="$HOME/.dotnet"
          mkdir -p "$DOTNET_INSTALL_DIR"
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          bash dotnet-install.sh --channel 9.0 --install-dir "$DOTNET_INSTALL_DIR"
          export DOTNET_ROOT="$DOTNET_INSTALL_DIR"
          export PATH="$DOTNET_INSTALL_DIR:$PATH"
          echo "dotnet location: $(which dotnet)"
          dotnet --info

      - name: Restore NuGet packages
        run: |
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$HOME/.dotnet:$PATH"
          dotnet restore --verbosity minimal

      - name: Build solution
        run: |
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$HOME/.dotnet:$PATH"
          dotnet build ProjectionMapper.sln --configuration Release --no-restore --verbosity minimal

      - name: Run tests (if any)
        run: |
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$HOME/.dotnet:$PATH"
          dotnet test --no-build --verbosity normal || true

      - name: Save build artifacts (logs)
        if: always()
        run: |
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --info > build_log.txt || true
          ls -la > build_ls.txt || true
          echo "Workflow completed" > workflow_status.txt

      - name: Upload build artifacts (self-hosted fallback)
        if: always()
        uses: ./  
        with:
          _dummy: 'noop'
