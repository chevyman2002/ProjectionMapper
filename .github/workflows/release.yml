name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0-beta.1)'
        required: true
        type: string
      release_title:
        description: 'Release title (leave empty for default)'
        required: false
        type: string

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_NAME: ProjectionMapper

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish Self-Contained
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/self-contained

    - name: Publish Framework-Dependent
      run: dotnet publish -c Release -r win-x64 --self-contained false -o ./publish/framework-dependent

    - name: Create ZIP Archives
      run: |
        Compress-Archive -Path ./publish/self-contained/* -DestinationPath ./ProjectionMapper-win-x64-self-contained.zip
        Compress-Archive -Path ./publish/framework-dependent/* -DestinationPath ./ProjectionMapper-win-x64-framework-dependent.zip

    - name: Determine Release Info
      id: release_info
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $tag = "${{ github.event.inputs.release_tag }}"
          $title = "${{ github.event.inputs.release_title }}"
          if ([string]::IsNullOrEmpty($title)) {
            $title = "Beta: $tag - Initial Beta Release"
          }
        } else {
          $tag = "${{ github.ref_name }}"
          $title = "Beta: $tag - Initial Beta Release"
        }
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        echo "TITLE=$title" >> $env:GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.TAG }}
        name: ${{ steps.release_info.outputs.TITLE }}
        body: |
          ## ProjectionMapper Beta Release

          This is a beta release of ProjectionMapper, an open-source projection mapping software for Windows.

          ### Download Options

          | Package | Description |
          |---------|-------------|
          | **Self-Contained** | Includes .NET runtime. No additional installation required. Larger file size (~150MB). |
          | **Framework-Dependent** | Requires [.NET 9 Runtime](https://dotnet.microsoft.com/download/dotnet/9.0) to be installed. Smaller file size (~5MB). |

          ### Prerequisites

          - **Windows 10** (version 1903 or later) or **Windows 11**
          - **FFmpeg**: Required for video decoding. Download from [ffmpeg.org](https://ffmpeg.org/download.html) and ensure it is in your system PATH.

          ### How to Test

          1. **Download** the appropriate ZIP file for your system
          2. **Extract** the contents to a folder of your choice
          3. **Run** `ProjectionMapper.exe`
          4. **Connect** your projectors/displays before launching the application

          ### Reporting Issues

          If you encounter any bugs or issues:

          1. Go to the [Issues](https://github.com/${{ github.repository }}/issues) page
          2. Click **New Issue**
          3. Include the following information:
             - Steps to reproduce the issue
             - Expected vs actual behavior
             - Your Windows version
             - Number and type of displays connected
             - Any error messages or screenshots

          ### Known Limitations

          - Audio playback is currently experimental and may cause video glitches
          - Tested primarily with HDMI and WiFi-connected projectors

          ### Feedback

          Your feedback helps improve ProjectionMapper! Please share your experience in the Issues section.

          ---
          *This release was automatically generated by GitHub Actions.*
        draft: false
        prerelease: true
        files: |
          ./ProjectionMapper-win-x64-self-contained.zip
          ./ProjectionMapper-win-x64-framework-dependent.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

