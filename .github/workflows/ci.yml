name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Display .NET version
        run: dotnet --info

      - name: Restore NuGet packages
        run: dotnet restore ProjectionMapper.csproj --verbosity minimal

      - name: Build project
        run: dotnet build ProjectionMapper.csproj --configuration Release --no-restore --verbosity minimal

      - name: Run tests (if any)
        run: dotnet test --no-build --verbosity normal || true

      - name: Save build info
        if: always()
        run: |
          dotnet --info > build_log.txt || true
          dir /a > build_ls.txt || true
          echo "Workflow completed" > workflow_status.txt
