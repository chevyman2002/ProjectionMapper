name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates wget unzip

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Display .NET version
        run: dotnet --info

      - name: Restore NuGet packages
        run: dotnet restore --verbosity minimal

      - name: Build solution
        run: dotnet build ProjectionMapper.sln --configuration Release --no-restore --verbosity minimal

      - name: Run tests (if any)
        run: dotnet test --no-build --verbosity normal || true

      - name: Save build info
        if: always()
        run: |
          dotnet --info > build_log.txt || true
          ls -la > build_ls.txt || true
          echo "Workflow completed" > workflow_status.txt
